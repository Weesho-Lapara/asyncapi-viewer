# Documentation site for asyncapi-viewer. It is built with the plugin itself, so a
# strict build of this site is an end-to-end test. Both the MkDocs plugin and
# the bare Markdown extension are listed so the same file builds under MkDocs
# and under Zensical (which ignores `plugins` but honours `markdown_extensions`).
# Under MkDocs the plugin publishes the packaged viewer into the site itself and
# overrides the extension settings below; Zensical has no plugin hooks, so the
# extension entry points at a copy made by `python -m asyncapi_viewer copy-assets
# docs/assets/asyncapi-viewer` (ignored by git, run in CI before `zensical build`).
site_name: asyncapi-viewer
site_description: Render AsyncAPI documents in Markdown and MkDocs with a single <asyncapi-viewer> element.
site_url: https://weesho-lapara.github.io/asyncapi-viewer/
repo_url: https://github.com/Weesho-Lapara/asyncapi-viewer
repo_name: Weesho-Lapara/asyncapi-viewer
edit_uri: edit/main/docs/
copyright: MIT licensed. Made by <a href="https://weesholapara.com" target="_blank" rel="noopener">Weesho Lapara</a>.

nav:
  - Overview: index.md
  - Live demo: demo.md
  - Attributes: attributes.md
  - Configuration: configuration.md
  - Customising: customising.md
  - Other tools: other-tools.md
  - Migration: migration.md
  - Changelog: changelog.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - asyncapi-viewer

markdown_extensions:
  - asyncapi_viewer:
      # Zensical only (MkDocs replaces these with the served copy and its hashes).
      viewer_js: /assets/asyncapi-viewer/asyncapi-viewer.js
      viewer_theme: /assets/asyncapi-viewer/asyncapi-theme.css
      viewer_js_integrity: ''
      viewer_theme_integrity: ''
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: material/web
      link: https://weesholapara.com
      name: weesholapara.com
    - icon: fontawesome/brands/github
      link: https://github.com/Weesho-Lapara/asyncapi-viewer
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/asyncapi-viewer/
